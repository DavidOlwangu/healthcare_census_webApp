<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Healthcare Census Web App</title> 
    </head>
    <body>
        <!--Navigation Bar-->
        <nav>
            <h1>Healthcare Analysis Census</h1>
            <ul>
                <li><a href="index.html" id="home">Home</a></li>
                <li><a href="health_contact.html" id="contact">Contact Us</a></li>
                <li><input type="text" id="conditionInput" placeholder="Enter a health condition"></li>
                <li><button id="btnSearch">Search</button></li>
            </ul>
        </nav>

        <div class="container">
            <div class="analysisForm">
                <h1>Healthcare Data Analysis</h1>
            </div>
        </div>

        <!--Name-->
        <div>
            <label for="name">Name:</label>
            <input type="text" id="name">
        </div>

        <!--Gender-->
        <div>
            <label>Gender:</label>
            <label for="male">Male</label>
            <input type="radio" name="gender" id="male" value="Male">

            <label for="female">Female</label>
            <input type="radio" name="gender" id="female" value="Female">
        </div>

        <!--Age-->
        <div>
            <label for="age">Age:</label>
            <input type="number" id="age">
        </div>

        <!--Condition-->
        <div>
            <label for="condition">Condition:</label>
            <select id="condition">
                <option value="">Select conditon</option>
                <option value="Diabetes">Diabetes</option>
                <option value="Thyroid">Thyroid</option>
                <option value="High Blood Pressure">High Blood Pressure</option>
            </select>
        </div>

        <!--Add patient button-->
        <button id="addPatient">Add Patient</button>

        <!--h2 Analysis report-->
        <h2>Analysis Report</h2>
        <div id="report">
            <!--Report-->
        </div>

        <div class="searchCondition">
            <div id="result"></div>
        </div>

        <script src="script.js"></script>
    </body>
</html>
