<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Contact Us</title>
        <link rel="stylesheet" href="style.css">
        <style>
            body{
                text-align: center;
            }
            /* Style the form */
            #contactForm {
                max-width: 400px;
                margin: 0 auto;
                padding: 20px;
                border: 1px solid #ccc;
                border-radius: 5px;
            }
            /* Style the input fields */
            #contactForm input, #contactForm textarea {
                width: 100%;
                padding: 10px;
                padding-right: 2px;
                margin-bottom: 15px;
                border: 1px solid #ccc;
                border-radius: 5px;
            }
            /* Style the submit button */
            #contactForm button {
                padding: 10px 20px;
                background-color: #007bff;
                color: white;
                border: none;
                cursor: pointer;
            }
            #contactForm button:hover{
                background-color: #0056b3;
            }
        </style>
    </head>
    <body>
        <nav>
            <h1>Healthcare Analysis Census</h1>
            <ul>
                <li><a href="index.html" id="home">Home</a></li>
                <li><a href="health_contact.html" id="contact">Contact Us</a></li>
            </ul>
        </nav>
        <h1>Contact Us </h1>
        <p>If you have any questions or need assistance, 
            please feel free to contact us to know more about 
            your conditions and for treatment methods:
        </p>

        <form id="contactForm">
            <div>
                <input type="text" id="name" placeholder="Your Name" required> 
            </div>

            <div>
                <input type="email" id="email" placeholder="Your Email" required>
            </div>

            <div>
                <input type="text" id="subject" placeholder="Condition" required>
            </div>

            <div>
                <textarea id="message" name="message" rows="5" placeholder="Your Message" required></textarea>
            </div>

            <div>
                <button type="button" onclick="thankyou()">Submit</button>
            </div>
        </form>
        <script>
            function thankyou() {
                alert("Thank you for contacting us! We will get back to you soon.");
            }
        </script>
    </body>
</html>
